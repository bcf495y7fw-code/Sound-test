<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Test</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
    button { display: block; width: 100%; padding: 1rem; font-size: 1.2rem; margin: 1rem 0; }
    #status { padding: 1rem; background: #f4f4f4; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>iOS Sound Diagnostic</h2>
  <button id="btn-test">Tap to Initialize & Play Tick</button>
  <div id="status">Waiting for tap...</div>

  <script>
    let soundOn = true; /* Required for tick() to run */

    /* ================= sounds ================= */
    const sounds = (() => {
      let ctx = null;
      let lastError = null; /* ADDED: To catch the silent error */
      
      function ac() {
        try {
          if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx && ctx.state === 'suspended') ctx.resume();
        } catch (e) {
          lastError = e.message || String(e); /* ADDED: Capture instead of swallow */
        }
        return ctx;
      }
      
      function note(f, { at = 0, dur = 0.18, type = 'sine', vol = 0.045 } = {}) {
        const c = ac(); if (!c) return;
        const t0 = c.currentTime + at;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(c.destination);
        o.start(t0); o.stop(t0 + dur + 0.05);
      }
      
      return {
        tick() { if (soundOn) note(1320, { dur: 0.04, vol: 0.015 }); },
        ok()   { if (!soundOn) return; note(660, { dur: 0.12 }); note(990, { at: 0.08, dur: 0.16, vol: 0.035 }); },
        bad()  { if (!soundOn) return; note(233, { dur: 0.16, type: 'triangle' }); note(174, { at: 0.1, dur: 0.22, type: 'triangle', vol: 0.05 }); },
        win()  { if (!soundOn) return; [523, 659, 784, 1046].forEach((f, i) => note(f, { at: i * 0.09, dur: 0.22, vol: 0.04 })); },
        lose() { if (!soundOn) return; [392, 311, 262].forEach((f, i) => note(f, { at: i * 0.12, dur: 0.26, type: 'triangle', vol: 0.045 })); },
        
        /* ADDED: Diagnostic getters */
        getState: () => ctx ? ctx.state : 'null (ctx is null)',
        getError: () => lastError || 'none'
      };
    })();

    document.getElementById('btn-test').addEventListener('click', () => {
      sounds.tick();
      
      /* Wait 100ms for resume() promise to settle, then read diagnostics */
      setTimeout(() => {
        const statusEl = document.getElementById('status');
        let output = `Context State: ${sounds.getState()}\n`;
        output += `Caught Error:  ${sounds.getError()}\n\n`;
        output += `--- Environment Check ---\n`;
        output += `window.AudioContext exists: ${!!window.AudioContext}\n`;
        output += `window.webkitAudioContext exists: ${!!window.webkitAudioContext}\n`;
        output += `Did you hear the tick sound?`;
        statusEl.textContent = output;
      }, 100);
    });
  </script>
</body>
</html>
